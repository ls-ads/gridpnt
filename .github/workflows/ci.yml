name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: gridpnt-linux-x86_64
            binary: target/release/gridpnt
          - os: macos-latest
            artifact: gridpnt-macos-arm64
            binary: target/release/gridpnt
          - os: windows-latest
            artifact: gridpnt-windows-x86_64
            binary: target/release/gridpnt.exe
            # Link the MSVC CRT statically so gridpnt.exe needs no VC++ redistributable (DIST-001).
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked
      - name: Smoke check release binary
        run: ./${{ matrix.binary }} --version
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
